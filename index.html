<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Neosophical Lab - Fresh Ideas. Smart Marketing.</title>
  <meta name="description" content="AI-powered advertising platform with budget safeguards for Facebook and Instagram.">
  <link rel="stylesheet" href="style.css">
  
  <!-- React & ReactDOM CDN for React Components -->
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body>

  <!-- React App Root Container -->
  <div id="root"></div>

  <!-- Legacy Static Markup Fallback Container -->
  <div id="app-fallback-root" class="hidden">
    <!-- Top Navigation Bar -->
    <header class="top-header">
      <a href="#dashboard" class="brand-container" id="brand-link" title="Neosophical Lab Home">
        <div class="brand-logo-icon">
          <svg viewBox="0 0 36 36" fill="none" width="24" height="24" xmlns="http://www.w3.org/2000/svg">
            <path d="M14 6H22M16 6V13.2L8.5 25.5C7.4 27.3 8.7 29.5 10.8 29.5H25.2C27.3 29.5 28.6 27.3 27.5 25.5L20 13.2V6" 
                  stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </div>
        <div class="brand-titles">
          <span class="brand-name">Neosophical Lab</span>
          <span class="brand-tagline">Fresh Ideas. Smart Marketing.</span>
        </div>
      </a>

      <div class="header-actions">
        <button class="theme-toggle-btn" id="theme-toggle" aria-label="Toggle Theme Mode">
          <span id="theme-toggle-label">Dark Mode</span>
        </button>

        <button class="btn" id="btn-quick-create">Create Campaign</button>
      </div>
    </header>

    <div class="app-container">
      <aside class="app-sidebar">
        <div>
          <div class="nav-section-label">Main Navigation</div>
          <ul class="nav-menu">
            <li><button class="nav-item-btn active" data-screen="screen-dashboard" id="nav-dashboard">Dashboard Overview</button></li>
            <li><button class="nav-item-btn" data-screen="screen-builder" id="nav-builder">AI Campaign Builder</button></li>
            <li><button class="nav-item-btn" data-screen="screen-editor" id="nav-editor">Plan and Editor</button></li>
            <li><button class="nav-item-btn" data-screen="screen-review" id="nav-review">Review and Launch</button></li>
            <li><button class="nav-item-btn" data-screen="screen-analytics" id="nav-analytics">Live Campaign</button></li>
          </ul>
        </div>
        <div style="margin-top: auto;">
          <div class="nav-section-label">Supported Platforms</div>
          <div style="padding: 0.5rem 0.75rem; font-size: 0.8125rem; display: flex; flex-direction: column; gap: 0.5rem;">
            <div style="display: flex; align-items: center; justify-content: space-between;">
              <span style="font-weight: 500;">Facebook Ads</span>
              <span class="badge">Active</span>
            </div>
            <div style="display: flex; align-items: center; justify-content: space-between;">
              <span style="font-weight: 500;">Instagram Ads</span>
              <span class="badge">Active</span>
            </div>
          </div>
        </div>
      </aside>

      <main class="main-view-container" id="main-container">
        <!-- Screens populated dynamically -->
      </main>
    </div>
  </div>

  <div class="toast-container" id="toast-container"></div>

  <!-- Include React App Script -->
  <script type="text/babel" src="script.js"></script>
</body>
</html>
